[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ivan Yong Pak Theng", email = "ivanyong07@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "anthropic>=1.7.0",
    "asyncmy>=0.2.14",
    "fastapi>=0.141.1",
    "fastapi-users-db-sqlalchemy>=7.0.0",
    "groq>=1.7.0",
    "middleware>=1.2.3",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
package = false
